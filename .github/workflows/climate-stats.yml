name: Offer climate stats

# Weekly refresh of offer_climate_stats (UV, air temperature, water temperature per
# offer spot) and country_climate_stats (same per country kite spot from
# climate_country_points, the map layers next to wind_stats). New offers and moved
# pins (e.g. corrected accommodation locations) get their spot's climate; only cells
# not yet cached in climate_points are fetched.
# Unknown departure ports are listed in the log -> add them to climate_port_points.
# Fetcher: Copernicus ERA5 via CDS (CC-BY 4.0, UV computed) with the CDS_API_KEY secret;
# the free Open-Meteo API is non-commercial only. New cells are stored as they arrive, so a
# run stopped by max_fetch / the time budget / the timeout continues on the next run.
# Lives outside web/**, so it never triggers the Docker build/deploy workflow.
on:
  schedule:
    # Mondays 05:00 UTC (before the daily monitor at 06:00)
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        type: boolean
        required: false
        default: false
      max_fetch:
        description: 'Max new climate cells to fetch (empty = all)'
        type: string
        required: false
        default: ''
      task:
        description: 'climate-stats (default) or climate-wind-check (read-only ERA5 wind comparison)'
        type: choice
        options: [climate-stats, climate-wind-check]
        required: false
        default: climate-stats

concurrency:
  group: offer-climate-stats
  cancel-in-progress: false

jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Refresh climate per offer and country
        # TAVILY/OPENROUTER keys are not used by climate-stats, but src/cli.ts's static
        # import graph pulls in src/lib/tavily.ts, which throws at module load if absent.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Copernicus CDS personal access token; without it Open-Meteo is used
          CDSAPI_KEY: ${{ secrets.CDS_API_KEY }}
          # optional: commercial Open-Meteo key (customer-* hosts); free tier is used without it
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_FETCH: ${{ github.event.inputs.max_fetch }}
          TASK: ${{ github.event.inputs.task }}
        # budget stops starting new fetches ~80 min before the job timeout so the rows still get written
        run: |
          if [ "$TASK" = "climate-wind-check" ]; then pnpm cli climate-wind-check; exit 0; fi
          args="--budget-min 270"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          if [ -n "$MAX_FETCH" ]; then args="$args --max-fetch $MAX_FETCH"; fi
          pnpm cli climate-stats $args
